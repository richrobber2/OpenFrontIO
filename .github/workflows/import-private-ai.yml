name: Import private AI history

on:
  push:
    branches:
      - migration/import-private-ai

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      MIGRATION_URL: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-1bbc-81fd-bd95-1273a80ff9ff/raw?se=2026-08-05T17:13:48Z&sp=r&sv=2026-02-06&sr=b&scid=e7076bd2-b54e-5953-9a2b-f736f18722e4&skoid=fadb8e47-d3c7-4c79-a9c3-970d9af3b213&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-04T21:55:48Z&ske=2026-08-05T21:55:48Z&sks=b&skv=2026-02-06&sig=NLSHxCchxgXY/bMPHGDuucJE5mXpjrq0vmV3R4YcyoA%3D"
    steps:
      - name: Check out clean fork branch
        uses: actions/checkout@v4
        with:
          ref: migration/import-private-ai
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Download and verify migration artifact
        run: |
          set -euo pipefail
          mkdir -p /tmp/private-ai
          curl --fail --location --retry 3 "$MIGRATION_URL" -o /tmp/private-ai.zip
          unzip -q /tmp/private-ai.zip -d /tmp/private-ai
          (cd /tmp/private-ai && sha256sum -c SHA256SUMS)
          git bundle verify /tmp/private-ai/private-ai.bundle
          git fetch /tmp/private-ai/private-ai.bundle 'refs/remotes/origin/main:refs/remotes/legacy/private-main'

      - name: Find nearest official snapshot and build complete delta
        run: |
          set -euo pipefail
          old_root=$(git rev-list --max-parents=0 legacy/private-main | head -n 1)
          echo "Private import root: $old_root"

          mapfile -t candidates < <(
            git rev-list \
              --after='2026-07-10T00:00:00Z' \
              --before='2026-07-21T23:59:59Z' \
              origin/main
          )
          if (( ${#candidates[@]} == 0 )); then
            mapfile -t candidates < <(git rev-list origin/main)
          fi

          best_commit=""
          best_score=9223372036854775807
          : > /tmp/private-ai/base-scores.txt
          for commit in "${candidates[@]}"; do
            files=$(git diff --name-only "$commit" "$old_root" | wc -l)
            lines=$(git diff --numstat "$commit" "$old_root" | awk '
              { a = ($1 == "-" ? 0 : $1); d = ($2 == "-" ? 0 : $2); total += a + d }
              END { print total + 0 }
            ')
            score=$((files * 100000 + lines))
            printf '%020d %6d %9d %s %s\n' \
              "$score" "$files" "$lines" "$commit" \
              "$(git show -s --format=%cs "$commit")" \
              >> /tmp/private-ai/base-scores.txt
            if (( score < best_score )); then
              best_score=$score
              best_commit=$commit
            fi
          done

          sort -n /tmp/private-ai/base-scores.txt | head -n 10
          if [[ -z "$best_commit" ]]; then
            echo "Unable to identify an upstream base snapshot."
            exit 1
          fi

          echo "Selected official base: $best_commit"
          echo "Selected base date: $(git show -s --format=%cI "$best_commit")"
          echo "BASE_COMMIT=$best_commit" >> "$GITHUB_ENV"

          git diff --binary "$best_commit" legacy/private-main > /tmp/private-ai/full-private-ai.patch
          echo "Complete migration patch size: $(wc -c < /tmp/private-ai/full-private-ai.patch) bytes"
          git diff --shortstat "$best_commit" legacy/private-main

      - name: Apply complete custom delta with three-way merge
        run: |
          set -uo pipefail
          if git apply --3way --index --whitespace=nowarn /tmp/private-ai/full-private-ai.patch; then
            echo "PATCH_APPLIED=true" >> "$GITHUB_ENV"
          else
            echo "PATCH_APPLIED=false" >> "$GITHUB_ENV"
            echo "Unmerged paths:"
            git diff --name-only --diff-filter=U | tee /tmp/private-ai/conflicts.txt
            echo "Status:"
            git status --short
            exit 1
          fi

      - name: Install dependencies
        if: env.PATCH_APPLIED == 'true'
        run: npm ci --ignore-scripts

      - name: Run focused AI validation
        if: env.PATCH_APPLIED == 'true'
        run: |
          npx vitest run \
            tests/client/CounterPressureAndTribeOpportunity.test.ts \
            tests/client/ImmediateTribeResponseIntegration.test.ts \
            tests/client/WildernessExpansionPolicy.test.ts \
            tests/client/WildernessExpansionIntegration.test.ts \
            tests/client/OverseasExpansionPolicy.test.ts \
            tests/client/StrategicWeaponsPolicy.test.ts \
            tests/client/VisualAiStrategyIntegration.test.ts \
            tests/client/view/UnitViewOwnership.test.ts

      - name: Build production client
        if: env.PATCH_APPLIED == 'true'
        run: npm run build:prod

      - name: Audit dependencies
        if: env.PATCH_APPLIED == 'true'
        run: npm audit --audit-level=high

      - name: Commit imported delta and remove one-shot workflow
        if: env.PATCH_APPLIED == 'true'
        run: |
          set -euo pipefail
          git rm .github/workflows/import-private-ai.yml
          git add -A
          git commit -m "Import private AI development onto current upstream"
          git push origin HEAD:migration/import-private-ai
