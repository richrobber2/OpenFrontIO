name: Import private AI history

on:
  push:
    branches:
      - migration/import-private-ai

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      MIGRATION_URL: "https://sdmntprwestus.oaiusercontent.com/files/00000000-f918-8230-81e7-dec42a412223/raw?se=2026-08-05T17:24:32Z&sp=r&sv=2026-02-06&sr=b&scid=9559a12c-241e-582b-92a2-930890350cab&skoid=fadb8e47-d3c7-4c79-a9c3-970d9af3b213&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T12:17:29Z&ske=2026-08-06T12:17:29Z&sks=b&skv=2026-02-06&sig=fEqNwoNPQEii98kiA55rLGNZNnqOxt9e90q07KAznqc%3D"
      BASE_COMMIT: "943740de3238c1ca9b8fda24609e74b65d7365a3"
    steps:
      - name: Check out clean fork branch
        uses: actions/checkout@v4
        with:
          ref: migration/import-private-ai
          fetch-depth: 0
          filter: blob:none

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Download and verify migration artifact
        run: |
          set -euo pipefail
          mkdir -p /tmp/private-ai
          curl --fail --location --retry 3 "$MIGRATION_URL" -o /tmp/private-ai.zip
          unzip -q /tmp/private-ai.zip -d /tmp/private-ai
          (cd /tmp/private-ai && sha256sum -c SHA256SUMS)
          git bundle verify /tmp/private-ai/private-ai.bundle
          git fetch /tmp/private-ai/private-ai.bundle 'refs/remotes/origin/main:refs/remotes/legacy/private-main'

      - name: Build complete custom delta
        run: |
          set -euo pipefail
          git cat-file -e "$BASE_COMMIT^{commit}"
          git diff --binary "$BASE_COMMIT" legacy/private-main > /tmp/private-ai/full-private-ai.patch
          echo "Official base: $BASE_COMMIT"
          echo "Complete migration patch size: $(wc -c < /tmp/private-ai/full-private-ai.patch) bytes"
          git diff --shortstat "$BASE_COMMIT" legacy/private-main

      - name: Apply complete custom delta with three-way merge
        id: apply
        continue-on-error: true
        run: |
          set -euo pipefail
          git apply --3way --index --whitespace=nowarn /tmp/private-ai/full-private-ai.patch
          echo "PATCH_APPLIED=true" >> "$GITHUB_ENV"

      - name: Package exact conflict stages
        if: steps.apply.outcome == 'failure'
        run: |
          set -euo pipefail
          root=/tmp/migration-conflicts
          mkdir -p "$root/base" "$root/upstream" "$root/private" "$root/merged"
          git diff --name-only --diff-filter=U > "$root/conflicts.txt"
          printf '%s\n' "$BASE_COMMIT" > "$root/selected-base.txt"

          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            for dir in base upstream private merged; do
              mkdir -p "$root/$dir/$(dirname "$file")"
            done
            git show ":1:$file" > "$root/base/$file" || true
            git show ":2:$file" > "$root/upstream/$file" || true
            git show ":3:$file" > "$root/private/$file" || true
            git checkout --conflict=diff3 -- "$file"
            cp "$file" "$root/merged/$file"
          done < "$root/conflicts.txt"

          echo "Captured conflicts:"
          cat "$root/conflicts.txt"

      - name: Upload conflict diagnostics
        if: steps.apply.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: private-ai-conflicts
          path: /tmp/migration-conflicts
          if-no-files-found: error
          retention-days: 7

      - name: Stop for deliberate conflict resolution
        if: steps.apply.outcome == 'failure'
        run: exit 1

      - name: Install dependencies
        if: env.PATCH_APPLIED == 'true'
        run: npm ci --ignore-scripts

      - name: Run focused AI validation
        if: env.PATCH_APPLIED == 'true'
        run: |
          npx vitest run \
            tests/client/CounterPressureAndTribeOpportunity.test.ts \
            tests/client/ImmediateTribeResponseIntegration.test.ts \
            tests/client/WildernessExpansionPolicy.test.ts \
            tests/client/WildernessExpansionIntegration.test.ts \
            tests/client/OverseasExpansionPolicy.test.ts \
            tests/client/StrategicWeaponsPolicy.test.ts \
            tests/client/VisualAiStrategyIntegration.test.ts \
            tests/client/view/UnitViewOwnership.test.ts

      - name: Build production client
        if: env.PATCH_APPLIED == 'true'
        run: npm run build:prod

      - name: Audit dependencies
        if: env.PATCH_APPLIED == 'true'
        run: npm audit --audit-level=high

      - name: Commit imported delta and remove one-shot workflow
        if: env.PATCH_APPLIED == 'true'
        run: |
          set -euo pipefail
          git rm .github/workflows/import-private-ai.yml
          git add -A
          git commit -m "Import private AI development onto current upstream"
          git push origin HEAD:migration/import-private-ai
