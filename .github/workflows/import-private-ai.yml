name: Import private AI history

on:
  push:
    branches:
      - migration/import-private-ai

permissions:
  contents: write

jobs:
  import:
    if: github.event.head_commit.message == 'ci: persist migrated source without workflow mutations'
    runs-on: ubuntu-latest
    env:
      MIGRATION_URL: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-ca7c-81fd-8fe8-010aa0957536/raw?se=2026-08-05T18:04:25Z&sp=r&sv=2026-02-06&sr=b&scid=bc13ae0c-1be4-5d04-81c1-2ca3291a9807&skoid=fadb8e47-d3c7-4c79-a9c3-970d9af3b213&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T12:17:55Z&ske=2026-08-06T12:17:55Z&sks=b&skv=2026-02-06&sig=UTBmyIJ%2BIyJVqakG8sij5PNjigs7hIBuNzBebL80wmo%3D"
      BASE_COMMIT: "943740de3238c1ca9b8fda24609e74b65d7365a3"
    steps:
      - name: Check out clean fork branch
        uses: actions/checkout@v4
        with:
          ref: migration/import-private-ai
          fetch-depth: 1

      - name: Configure Git and fetch official base
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 --no-tags origin "$BASE_COMMIT"
          git cat-file -e "$BASE_COMMIT^{commit}"

      - name: Download and verify migration artifact
        run: |
          set -euo pipefail
          mkdir -p /tmp/private-ai
          curl --fail --location --retry 3 "$MIGRATION_URL" -o /tmp/private-ai.zip
          unzip -q /tmp/private-ai.zip -d /tmp/private-ai
          (cd /tmp/private-ai && sha256sum -c SHA256SUMS)
          git bundle verify /tmp/private-ai/private-ai.bundle
          git fetch /tmp/private-ai/private-ai.bundle 'refs/remotes/origin/main:refs/remotes/legacy/private-main'

      - name: Build complete custom delta
        run: |
          set -euo pipefail
          git diff --binary "$BASE_COMMIT" legacy/private-main > /tmp/private-ai/full-private-ai.patch
          echo "Complete migration patch size: $(wc -c < /tmp/private-ai/full-private-ai.patch) bytes"
          git diff --shortstat "$BASE_COMMIT" legacy/private-main

      - name: Apply complete custom delta with three-way merge
        id: apply
        continue-on-error: true
        run: |
          set -euo pipefail
          git apply --3way --index --whitespace=nowarn /tmp/private-ai/full-private-ai.patch

      - name: Resolve known upstream and private overlaps
        if: steps.apply.outcome == 'failure'
        run: |
          set -euo pipefail

          actual=$(git diff --name-only --diff-filter=U | sort)
          expected=$(printf '%s\n' \
            '.github/workflows/pr-stale.yml' \
            '.gitignore' \
            '.husky/pre-commit' \
            'package-lock.json' \
            'package.json' \
            'src/client/ClientGameRunner.ts' \
            'src/client/Main.ts' \
            'src/client/SinglePlayerModal.ts' \
            'src/client/components/PlayPage.ts' | sort)

          if [[ "$actual" != "$expected" ]]; then
            echo "Unexpected conflict set. Refusing an improvised merge."
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual"
            exit 1
          fi

          resolve_union() {
            local file="$1"
            local key
            key=$(printf '%s' "$file" | sha256sum | cut -d' ' -f1)
            mkdir -p "/tmp/union-$key"
            git show ":2:$file" > "/tmp/union-$key/upstream"
            git show ":1:$file" > "/tmp/union-$key/base"
            git show ":3:$file" > "/tmp/union-$key/private"
            git merge-file --union \
              "/tmp/union-$key/upstream" \
              "/tmp/union-$key/base" \
              "/tmp/union-$key/private" || true
            cp "/tmp/union-$key/upstream" "$file"
            git add "$file"
          }

          git checkout --ours -- .github/workflows/pr-stale.yml
          git add .github/workflows/pr-stale.yml
          resolve_union .gitignore
          resolve_union .husky/pre-commit

          git show :2:package.json > /tmp/upstream-package.json
          git show :3:package.json > /tmp/private-package.json
          node <<'NODE'
          const fs = require('node:fs');
          const upstream = JSON.parse(fs.readFileSync('/tmp/upstream-package.json', 'utf8'));
          const legacy = JSON.parse(fs.readFileSync('/tmp/private-package.json', 'utf8'));
          const result = { ...legacy, ...upstream };
          for (const section of [
            'scripts',
            'dependencies',
            'devDependencies',
            'optionalDependencies',
            'peerDependencies',
            'overrides',
            'engines',
            'lint-staged',
          ]) {
            if (legacy[section] || upstream[section]) {
              result[section] = {
                ...(legacy[section] ?? {}),
                ...(upstream[section] ?? {}),
              };
            }
          }
          fs.writeFileSync('package.json', `${JSON.stringify(result, null, 2)}\n`);
          NODE
          git add package.json

          git checkout --ours -- package-lock.json
          git add package-lock.json
          resolve_union src/client/ClientGameRunner.ts
          resolve_union src/client/Main.ts
          resolve_union src/client/SinglePlayerModal.ts
          resolve_union src/client/components/PlayPage.ts
          python scripts/resolve-private-ai-migration.py
          git add \
            src/client/ClientGameRunner.ts \
            src/client/Main.ts \
            src/client/SinglePlayerModal.ts \
            src/client/components/PlayPage.ts

          test -z "$(git diff --name-only --diff-filter=U)"
          npm install --package-lock-only --ignore-scripts
          git add package-lock.json

      - name: Install and validate migration
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx prettier --write \
            package.json \
            src/client/ClientGameRunner.ts \
            src/client/Main.ts \
            src/client/SinglePlayerModal.ts \
            src/client/components/PlayPage.ts
          npx eslint \
            src/client/ClientGameRunner.ts \
            src/client/Main.ts \
            src/client/SinglePlayerModal.ts \
            src/client/components/PlayPage.ts
          npx vitest run \
            tests/client/CounterPressureAndTribeOpportunity.test.ts \
            tests/client/ImmediateTribeResponseIntegration.test.ts \
            tests/client/WildernessExpansionPolicy.test.ts \
            tests/client/WildernessExpansionIntegration.test.ts \
            tests/client/OverseasExpansionPolicy.test.ts \
            tests/client/StrategicWeaponsPolicy.test.ts \
            tests/client/VisualAiStrategyIntegration.test.ts \
            tests/client/view/UnitViewOwnership.test.ts
          npm audit --audit-level=high

      - name: Persist migration branch without workflow mutations
        run: |
          set -euo pipefail
          git restore --source=HEAD --staged --worktree .github/workflows
          git rm scripts/resolve-private-ai-migration.py
          git add -A
          git commit -m "Import private AI development onto current upstream"
          git push origin HEAD:migration/import-private-ai
