name: Import private AI history

on:
  push:
    branches:
      - migration/import-private-ai

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      MIGRATION_URL: "https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-4130-81f7-a1fa-8c57319027fd/raw?se=2026-08-05T17:10:38Z&sp=r&sv=2026-02-06&sr=b&scid=5783d39f-88fb-5e11-9b6c-53e74aaeb3e6&skoid=fadb8e47-d3c7-4c79-a9c3-970d9af3b213&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-05T12:17:25Z&ske=2026-08-06T12:17:25Z&sks=b&skv=2026-02-06&sig=wgz6K5vHnTpvz7SBcFR4VhsoufDVEbjlPtYI7w4bWsg%3D"
    steps:
      - name: Check out clean fork branch
        uses: actions/checkout@v4
        with:
          ref: migration/import-private-ai
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Download and verify migration artifact
        run: |
          set -euo pipefail
          mkdir -p /tmp/private-ai
          curl --fail --location --retry 3 "$MIGRATION_URL" -o /tmp/private-ai.zip
          unzip -q /tmp/private-ai.zip -d /tmp/private-ai
          (cd /tmp/private-ai && sha256sum -c SHA256SUMS)
          git bundle verify /tmp/private-ai/private-ai.bundle
          git fetch /tmp/private-ai/private-ai.bundle 'refs/remotes/origin/main:refs/remotes/legacy/private-main'

      - name: Find matching upstream snapshot and build complete delta
        run: |
          set -euo pipefail
          declare -A upstream_by_tree
          while read -r commit; do
            tree=$(git show -s --format=%T "$commit")
            upstream_by_tree["$tree"]="$commit"
          done < <(git rev-list HEAD)

          old_base=""
          upstream_base=""
          while read -r commit; do
            tree=$(git show -s --format=%T "$commit")
            if [[ -n "${upstream_by_tree[$tree]:-}" ]]; then
              old_base="$commit"
              upstream_base="${upstream_by_tree[$tree]}"
              break
            fi
          done < <(git rev-list legacy/private-main)

          if [[ -z "$old_base" ]]; then
            echo "No identical snapshot exists between the private history and upstream history."
            exit 1
          fi

          echo "Matched private snapshot:  $old_base"
          echo "Matched upstream snapshot: $upstream_base"
          echo "OLD_BASE=$old_base" >> "$GITHUB_ENV"
          echo "UPSTREAM_BASE=$upstream_base" >> "$GITHUB_ENV"

          git diff --binary "$old_base"..legacy/private-main > /tmp/private-ai/full-private-ai.patch
          echo "Complete migration patch size: $(wc -c < /tmp/private-ai/full-private-ai.patch) bytes"
          git diff --stat "$old_base"..legacy/private-main | tail -n 20

      - name: Apply complete custom delta with three-way merge
        run: |
          set -uo pipefail
          if git apply --3way --index --whitespace=nowarn /tmp/private-ai/full-private-ai.patch; then
            echo "PATCH_APPLIED=true" >> "$GITHUB_ENV"
          else
            echo "PATCH_APPLIED=false" >> "$GITHUB_ENV"
            echo "Unmerged paths:"
            git diff --name-only --diff-filter=U | tee /tmp/private-ai/conflicts.txt
            echo "Status:"
            git status --short
            exit 1
          fi

      - name: Install dependencies
        if: env.PATCH_APPLIED == 'true'
        run: npm ci --ignore-scripts

      - name: Run focused AI validation
        if: env.PATCH_APPLIED == 'true'
        run: |
          npx vitest run \
            tests/client/CounterPressureAndTribeOpportunity.test.ts \
            tests/client/ImmediateTribeResponseIntegration.test.ts \
            tests/client/WildernessExpansionPolicy.test.ts \
            tests/client/WildernessExpansionIntegration.test.ts \
            tests/client/OverseasExpansionPolicy.test.ts \
            tests/client/StrategicWeaponsPolicy.test.ts \
            tests/client/VisualAiStrategyIntegration.test.ts \
            tests/client/view/UnitViewOwnership.test.ts

      - name: Build production client
        if: env.PATCH_APPLIED == 'true'
        run: npm run build:prod

      - name: Audit dependencies
        if: env.PATCH_APPLIED == 'true'
        run: npm audit --audit-level=high

      - name: Commit imported delta and remove one-shot workflow
        if: env.PATCH_APPLIED == 'true'
        run: |
          set -euo pipefail
          git rm .github/workflows/import-private-ai.yml
          git add -A
          git commit -m "Import private AI development onto current upstream"
          git push origin HEAD:migration/import-private-ai
