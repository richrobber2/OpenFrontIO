name: Rust AI diagnostic

on:
  push:
    branches:
      - agent/rust-port
    paths:
      - .github/workflows/rust-ai-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Select Rust
        run: rustup default stable
      - name: Capture cargo test output
        id: cargo
        shell: bash
        run: |
          set +e
          cargo test --workspace > cargo-test.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload cargo output
        uses: actions/upload-artifact@v6
        with:
          name: cargo-test-log
          path: cargo-test.log
      - name: Preserve cargo result
        if: always()
        run: exit ${{ steps.cargo.outputs.status }}
