name: Rust economy policy patch once

on:
  push:
    branches:
      - agent/rust-port
    paths:
      - .github/workflows/rust-economy-patch-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rust-port
      - name: Patch economy policy integration
        run: |
          python3 <<'PY'
          from pathlib import Path

          strategy = Path("src/client/ai/StrategyMath.ts")
          text = strategy.read_text()

          anchor = '''} from "../rust/OpenFrontWasmAi";\nimport {\n  classifyLossCauseRust,'''
          replacement = '''} from "../rust/OpenFrontWasmAi";\nimport {\n  estimateTradeRouteGoldRust,\n  preloadRustEconomyAi,\n  railCityGrowthScoreRust,\n  scoreCityStackPlacementRust,\n  scoreFactoryPlacementRust,\n} from "../rust/OpenFrontWasmEconomyAi";\nimport {\n  classifyLossCauseRust,'''
          assert anchor in text
          text = text.replace(anchor, replacement, 1)

          anchor = '''void preloadRustLearningAi();'''
          replacement = '''void preloadRustLearningAi();\nvoid preloadRustEconomyAi();'''
          assert anchor in text
          text = text.replace(anchor, replacement, 1)

          anchor = '''export function railCityConnectionScore({'''
          replacement = '''export function railCityGrowthScore(\n  railConnections: number,\n  overlappingRailroads: number,\n): number {\n  const rust = railCityGrowthScoreRust(\n    railConnections,\n    overlappingRailroads,\n  );\n  if (rust !== null) return rust;\n\n  const overlap = Math.min(2, Math.max(0, overlappingRailroads));\n  const directStopBonus = overlap * 45;\n  const networkLeverage =\n    overlap > 0 ? Math.min(4, Math.max(0, railConnections)) * 10 : 0;\n  return (\n    Math.max(0, railConnections) * 20 +\n    directStopBonus +\n    networkLeverage\n  );\n}\n\nexport function railCityConnectionScore({'''
          assert anchor in text
          text = text.replace(anchor, replacement, 1)

          anchor = '''}): CityStackPlacementScore {\n  const minimum = Math.max(1, structureMinDistance);'''
          replacement = '''}): CityStackPlacementScore {\n  const rust = scoreCityStackPlacementRust(\n    cityDistancesSquared,\n    structureMinDistance,\n  );\n  if (rust !== null) return rust;\n\n  const minimum = Math.max(1, structureMinDistance);'''
          assert anchor in text
          text = text.replace(anchor, replacement, 1)

          anchor = '''export type FactoryPlacementScore = {\n  score: number;\n  productiveStops: number;\n  railEfficiency: number;\n};'''
          replacement = '''export type FactoryPlacementScore = {\n  score: number;\n  productiveStops: number;\n  railEfficiency: number;\n  railReuseScore: number;\n};'''
          assert anchor in text
          text = text.replace(anchor, replacement, 1)

          anchor = '''}): FactoryPlacementScore {\n  const ownStopValue = Math.max(0, ownCities) + Math.max(0, ownPorts) * 1.3;'''
          replacement = '''}): FactoryPlacementScore {\n  const rust = scoreFactoryPlacementRust({\n    ownCities,\n    ownPorts,\n    externalCities,\n    externalPorts,\n    factoryCorridorConnections,\n    overlappingRailroads,\n    ghostPathLengths,\n    railBends,\n    depth,\n    safestDepth,\n    nearestFactoryDistance,\n    minimumRange,\n    maximumRange,\n  });\n  if (rust !== null) return rust;\n\n  const ownStopValue = Math.max(0, ownCities) + Math.max(0, ownPorts) * 1.3;'''
          assert anchor in text
          text = text.replace(anchor, replacement, 1)

          anchor = '''  return {\n    score:\n      ownStopValue * 22 +\n      externalStopValue * 30 +\n      Math.max(0, factoryCorridorConnections) * 8 +\n      Math.min(3, routeCount) * 12 +\n      Math.max(0, overlappingRailroads) * 18 +\n      railEfficiency * 24 +\n      safety * 24 -\n      redundancyPenalty,\n    productiveStops,\n    railEfficiency,\n  };'''
          replacement = '''  const overlap = Math.min(3, Math.max(0, overlappingRailroads));\n  const directReuse = overlap * 32;\n  const reuseStopLeverage =\n    Math.min(1, overlap) * Math.min(4, productiveStops) * 6;\n  const throughputLeverage = Math.min(48, productiveStops * railEfficiency * 8);\n  const railReuseScore =\n    directReuse + reuseStopLeverage + throughputLeverage;\n\n  return {\n    score:\n      ownStopValue * 22 +\n      externalStopValue * 30 +\n      Math.max(0, factoryCorridorConnections) * 8 +\n      Math.min(3, routeCount) * 12 +\n      railEfficiency * 24 +\n      safety * 24 +\n      railReuseScore -\n      redundancyPenalty,\n    productiveStops,\n    railEfficiency,\n    railReuseScore,\n  };'''
          assert anchor in text
          text = text.replace(anchor, replacement, 1)

          anchor = '''export function estimateTradeRouteGold(\n  distance: number,\n  shortRangeDebuff = 300,\n): number {\n  return Math.floor('''
          replacement = '''export function estimateTradeRouteGold(\n  distance: number,\n  shortRangeDebuff = 300,\n): number {\n  const rust = estimateTradeRouteGoldRust(distance, shortRangeDebuff);\n  if (rust !== null) return rust;\n  return Math.floor('''
          assert anchor in text
          text = text.replace(anchor, replacement, 1)
          strategy.write_text(text)

          trainer = Path("src/client/ai/VisualAiTrainer.ts")
          text = trainer.read_text()
          anchor = '''  PredictionAction,\n  railCityConnectionScore,\n  scoreCityStackPlacement,'''
          replacement = '''  PredictionAction,\n  railCityConnectionScore,\n  railCityGrowthScore,\n  scoreCityStackPlacement,'''
          assert anchor in text
          text = text.replace(anchor, replacement, 1)

          anchor = '''            b.defenseScore +\n              b.railConnections * 20 +\n              b.stackPlacement.score +\n              (b.plan?.overlappingRailroads.length ?? 0) * 15 -\n              (a.defenseScore +\n                a.railConnections * 20 +\n                a.stackPlacement.score +\n                (a.plan?.overlappingRailroads.length ?? 0) * 15) ||'''
          replacement = '''            b.defenseScore +\n              b.stackPlacement.score +\n              railCityGrowthScore(\n                b.railConnections,\n                b.plan?.overlappingRailroads.length ?? 0,\n              ) -\n              (a.defenseScore +\n                a.stackPlacement.score +\n                railCityGrowthScore(\n                  a.railConnections,\n                  a.plan?.overlappingRailroads.length ?? 0,\n                )) ||'''
          assert anchor in text
          text = text.replace(anchor, replacement, 1)
          trainer.write_text(text)
          PY
      - name: Commit policy integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/ai/StrategyMath.ts src/client/ai/VisualAiTrainer.ts
          git commit -m "Wire growth-aware Rust economy placement"
          git push origin HEAD:agent/rust-port
