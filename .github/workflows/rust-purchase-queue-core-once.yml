name: Rust purchase queue core once

on:
  push:
    branches:
      - agent/rust-port
    paths:
      - .github/workflows/rust-purchase-queue-core-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rust-port
      - name: Wire purchase queue core
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              assert old in text, f"missing anchor in {path}: {old!r}"
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "rust/openfront-core/src/lib.rs",
              "pub mod ai_learning;\npub mod ai_ports;",
              "pub mod ai_learning;\npub mod ai_purchase_queue;\npub mod ai_ports;",
          )
          replace_once(
              "rust/openfront-core/src/lib.rs",
              "pub use ai_ports::{",
              "pub use ai_purchase_queue::{select_purchase_queue, PurchaseCandidate, PurchaseQueuePlan};\npub use ai_ports::{",
          )
          replace_once(
              "rust/openfront-wasm/src/lib.rs",
              "    AiOpponentRecordLengthMismatch = 18,\n    InternalInvariant = 255,",
              "    AiOpponentRecordLengthMismatch = 18,\n    AiPurchaseRecordLengthMismatch = 19,\n    InternalInvariant = 255,",
          )
          replace_once(
              "rust/openfront-wasm/src/lib.rs",
              'include!("ai_economy.rs");\ninclude!("ai_forecast.rs");',
              'include!("ai_economy.rs");\ninclude!("ai_purchase_queue.rs");\ninclude!("ai_forecast.rs");',
          )
          replace_once(
              "src/client/ai/AiModuleCoordinator.ts",
              "  goldSpendCap?: number;\n  goldCategory?: string;",
              "  goldSpendCap?: number;\n  goldMinimumQueuedPurchases?: number;\n  goldCategory?: string;",
          )
          replace_once(
              "src/client/ai/AiModule.ts",
              "        goldSpendCap: decision.spendCap,\n        goldCategory: decision.category,",
              "        goldSpendCap: decision.spendCap,\n        goldMinimumQueuedPurchases: decision.minimumQueuedPurchases,\n        goldCategory: decision.category,",
          )
          PY
          cargo fmt --all
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/openfront-core/src/lib.rs rust/openfront-wasm/src/lib.rs rust/openfront-core/src/ai_purchase_queue.rs rust/openfront-wasm/src/ai_purchase_queue.rs src/client/ai/AiModuleCoordinator.ts src/client/ai/AiModule.ts
          git commit -m "Wire Rust purchase queue core"
          git push origin HEAD:agent/rust-port
