name: Rust purchase queue patch once

on:
  push:
    branches:
      - agent/rust-port
    paths:
      - .github/workflows/rust-purchase-queue-patch-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rust-port
      - name: Wire purchase queue planner
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              assert old in text, f"missing anchor in {path}: {old[:80]!r}"
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "rust/openfront-core/src/lib.rs",
              "pub mod ai_learning;\npub mod ai_strategy;",
              "pub mod ai_learning;\npub mod ai_purchase_queue;\npub mod ai_strategy;",
          )
          replace_once(
              "rust/openfront-core/src/lib.rs",
              "pub use ai_strategy::{",
              "pub use ai_purchase_queue::{select_purchase_queue, PurchaseCandidate, PurchaseQueuePlan};\npub use ai_strategy::{",
          )

          replace_once(
              "rust/openfront-wasm/src/lib.rs",
              "    AiOpponentRecordLengthMismatch = 18,\n    InternalInvariant = 255,",
              "    AiOpponentRecordLengthMismatch = 18,\n    AiPurchaseRecordLengthMismatch = 19,\n    InternalInvariant = 255,",
          )
          replace_once(
              "rust/openfront-wasm/src/lib.rs",
              'include!("ai_economy.rs");\ninclude!("ai_forecast.rs");',
              'include!("ai_economy.rs");\ninclude!("ai_purchase_queue.rs");\ninclude!("ai_forecast.rs");',
          )

          replace_once(
              "src/client/rust/OpenFrontWasmTypes.ts",
              '  18: "uploaded AI opponent buffer is too short",\n  255:',
              '  18: "uploaded AI opponent buffer is too short",\n  19: "uploaded AI purchase queue buffer is too short",\n  255:',
          )

          replace_once(
              "src/client/ai/AiModuleCoordinator.ts",
              "  goldSpendCap?: number;\n  goldCategory?: string;",
              "  goldSpendCap?: number;\n  goldMinimumQueuedPurchases?: number;\n  goldCategory?: string;",
          )
          replace_once(
              "src/client/ai/AiModule.ts",
              "        goldSpendCap: decision.spendCap,\n        goldCategory: decision.category,",
              "        goldSpendCap: decision.spendCap,\n        goldMinimumQueuedPurchases: decision.minimumQueuedPurchases,\n        goldCategory: decision.category,",
          )

          facade = Path("src/client/rust/OpenFrontWasmEconomyAi.ts")
          text = facade.read_text()
          anchor = """export interface RustAdaptiveTradePortScore {\n  eligible: boolean;\n  score: number;\n  returnRatio: number;\n  distanceEfficiency: number;\n  spacingQuality: number;\n  expectedGoldPerTick: number;\n  paybackTicks: number;\n  diversityQuality: number;\n}\n\ntype EconomyWasmExports"""
          replacement = """export interface RustAdaptiveTradePortScore {\n  eligible: boolean;\n  score: number;\n  returnRatio: number;\n  distanceEfficiency: number;\n  spacingQuality: number;\n  expectedGoldPerTick: number;\n  paybackTicks: number;\n  diversityQuality: number;\n}\n\nexport interface RustPurchaseQueueCandidate {\n  index: number;\n  group?: number;\n  cost: number;\n  value: number;\n  returnRatio: number;\n  synergy: number;\n}\n\nexport interface RustPurchaseQueueContext {\n  spendCap: number;\n  minimumPurchases: number;\n  maximumPurchases: number;\n  risk: number;\n  capitalPressure: number;\n  candidates: readonly RustPurchaseQueueCandidate[];\n}\n\nexport interface RustPurchaseQueuePlan {\n  selectedIndices: number[];\n  totalCost: number;\n  totalScore: number;\n  remainingBudget: number;\n}\n\ntype EconomyWasmExports"""
          assert anchor in text
          text = text.replace(anchor, replacement, 1)

          anchor = """  openfront_ai_score_adaptive_trade_port_option(\n    minimumSiteQuality: number,"""
          assert anchor in text
          # Add queue export immediately before the type closes, using the exact tail of the port export.
          tail = """    maximumGoldRate: number,\n  ): number;\n};\n\nclass OpenFrontWasmEconomyAi"""
          queue_export = """    maximumGoldRate: number,\n  ): number;\n  openfront_ai_select_purchase_queue(\n    spendCap: number,\n    minimumPurchases: number,\n    maximumPurchases: number,\n    risk: number,\n    capitalPressure: number,\n    uploadHandle: number,\n    count: number,\n  ): number;\n};\n\nclass OpenFrontWasmEconomyAi"""
          assert tail in text
          text = text.replace(tail, queue_export, 1)

          anchor = '      "openfront_ai_score_adaptive_trade_port_option",\n    ] as const) {'
          replacement = '      "openfront_ai_score_adaptive_trade_port_option",\n      "openfront_ai_select_purchase_queue",\n    ] as const) {'
          assert anchor in text
          text = text.replace(anchor, replacement, 1)

          anchor = """  private readU32Result(expected: number, operation: string): Uint32Array {"""
          method = """  selectPurchaseQueue(context: RustPurchaseQueueContext): RustPurchaseQueuePlan {\n    const recordBytes = 40;\n    const byteLength = context.candidates.length * recordBytes;\n    const upload = this.wasm.openfront_upload_create(byteLength) >>> 0;\n    if (upload === 0) this.throwLastError("allocate purchase queue upload");\n    try {\n      const pointer = this.wasm.openfront_upload_ptr(upload) >>> 0;\n      if (byteLength > 0 && pointer === 0) {\n        this.throwLastError("map purchase queue upload");\n      }\n      const view = new DataView(this.wasm.memory.buffer, pointer, byteLength);\n      context.candidates.forEach((candidate, index) => {\n        const offset = index * recordBytes;\n        view.setUint32(offset, candidate.index >>> 0, true);\n        view.setUint32(offset + 4, (candidate.group ?? 0) >>> 0, true);\n        view.setFloat64(offset + 8, candidate.cost, true);\n        view.setFloat64(offset + 16, candidate.value, true);\n        view.setFloat64(offset + 24, candidate.returnRatio, true);\n        view.setFloat64(offset + 32, candidate.synergy, true);\n      });\n      if (\n        this.wasm.openfront_ai_select_purchase_queue(\n          context.spendCap,\n          context.minimumPurchases >>> 0,\n          context.maximumPurchases >>> 0,\n          context.risk,\n          context.capitalPressure,\n          upload,\n          context.candidates.length >>> 0,\n        ) === 0\n      ) {\n        this.throwLastError("select purchase queue");\n      }\n      const length = this.wasm.openfront_result_len() >>> 0;\n      const resultPointer = this.wasm.openfront_result_ptr() >>> 0;\n      const selectedIndices = Array.from(\n        new Uint32Array(this.wasm.memory.buffer, resultPointer, length),\n      );\n      const values = this.readF64Result(3, "read purchase queue totals");\n      return {\n        selectedIndices,\n        totalCost: values[0]!,\n        totalScore: values[1]!,\n        remainingBudget: values[2]!,\n      };\n    } finally {\n      this.wasm.openfront_upload_destroy(upload);\n    }\n  }\n\n  private readU32Result(expected: number, operation: string): Uint32Array {"""
          assert anchor in text
          text = text.replace(anchor, method, 1)

          anchor = """export function scoreAdaptiveTradePortOptionRust(\n  thresholds: RustAdaptiveTradePortThresholds,\n  option: RustAdaptiveTradePortOption,\n  normalization: RustAdaptiveTradePortNormalization,\n): RustAdaptiveTradePortScore | null {\n  return useRustEconomyAi((ai) =>\n    ai.scoreAdaptiveTradePortOption(thresholds, option, normalization),\n  );\n}\n\nfunction logRustEconomyAiFailure"""
          replacement = """export function scoreAdaptiveTradePortOptionRust(\n  thresholds: RustAdaptiveTradePortThresholds,\n  option: RustAdaptiveTradePortOption,\n  normalization: RustAdaptiveTradePortNormalization,\n): RustAdaptiveTradePortScore | null {\n  return useRustEconomyAi((ai) =>\n    ai.scoreAdaptiveTradePortOption(thresholds, option, normalization),\n  );\n}\n\nexport function selectPurchaseQueueRust(\n  context: RustPurchaseQueueContext,\n): RustPurchaseQueuePlan | null {\n  return useRustEconomyAi((ai) => ai.selectPurchaseQueue(context));\n}\n\nfunction logRustEconomyAiFailure"""
          assert anchor in text
          text = text.replace(anchor, replacement, 1)
          facade.write_text(text)

          trainer = Path("src/client/ai/VisualAiTrainer.ts")
          text = trainer.read_text()
          import_anchor = 'import { planRemnantConquest } from "./RemnantConquestPolicy";\n'
          assert import_anchor in text
          text = text.replace(
              import_anchor,
              import_anchor + 'import { selectPurchaseQueue } from "./PurchaseQueuePolicy";\n',
              1,
          )
          signal_anchor = """    this.moduleCoordination = moduleCoordination;\n    this.moduleSignals = moduleCoordination.signals;\n    const moduleDecisions = moduleCoordination.decisions;"""
          signal_replacement = """    this.moduleCoordination = moduleCoordination;\n    this.moduleSignals = moduleCoordination.signals;\n    const queuedPurchaseTarget = Math.max(\n      1,\n      Math.min(\n        32,\n        Math.floor(this.moduleSignals.goldMinimumQueuedPurchases ?? 1),\n      ),\n    );\n    const queuedGoldSpendCap = Math.max(\n      0,\n      Math.min(\n        this.economicPlan.spendableGold,\n        this.moduleSignals.goldSpendCap ?? this.economicPlan.spendableGold,\n      ),\n    );\n    const moduleDecisions = moduleCoordination.decisions;"""
          assert signal_anchor in text
          text = text.replace(signal_anchor, signal_replacement, 1)

          # Batch productive factory upgrades.
          start = text.index("      const highValueFactory = factoryUpgradePlans")
          end = text.index("      const structureMinDistance = this.game.config().structureMinDist();", start)
          upgrade_block = """      const highValueFactoryUpgrades = factoryUpgradePlans\n        .filter(\n          ({ productiveStops, economicScore, plan }) =>\n            productiveStops >= 2 &&\n            economicScore >= 2 &&\n            plan?.canUpgrade !== false &&\n            plan?.canUpgrade !== undefined,\n        )\n        .sort(\n          (a, b) =>\n            b.economicScore * (1 + b.factory.level() * 0.25) -\n            a.economicScore * (1 + a.factory.level() * 0.25),\n        );\n      if (\n        !needsPressureCity &&\n        !needsShipyardFactory &&\n        (this.economicPlan.action === "activate-rail" ||\n          this.economicPlan.action === "extend-trade") &&\n        highValueFactoryUpgrades.length > 0\n      ) {\n        const maximumUpgrades = Math.min(\n          4,\n          highValueFactoryUpgrades.length,\n        );\n        const upgradeQueue = selectPurchaseQueue({\n          spendCap: queuedGoldSpendCap,\n          minimumPurchases: Math.min(queuedPurchaseTarget, maximumUpgrades),\n          maximumPurchases: maximumUpgrades,\n          risk: this.economicPlan.risk,\n          capitalPressure: this.economicPlan.capitalDeploymentPressure,\n          candidates: highValueFactoryUpgrades.map((candidate, index) => ({\n            index,\n            cost: Number(candidate.plan!.cost),\n            value:\n              candidate.economicScore *\n              (1 + candidate.factory.level() * 0.25),\n            returnRatio: Math.min(1, candidate.productiveStops / 6),\n            synergy: candidate.protectedByDefensePost ? 1 : 0.4,\n          })),\n        });\n        const queuedUpgrades = upgradeQueue.selectedIndices\n          .map((index) => highValueFactoryUpgrades[index])\n          .filter((candidate) => candidate?.plan?.canUpgrade !== undefined);\n        if (queuedUpgrades.length > 0) {\n          for (const candidate of queuedUpgrades) {\n            this.eventBus.emit(\n              new SendUpgradeStructureIntentEvent(\n                candidate!.plan!.canUpgrade as number,\n                UnitType.Factory,\n              ),\n            );\n          }\n          this.nextEconomicCostRefreshTick = 0;\n          this.nextFactoryOpportunityTick = factoryOpportunityRetryTick(\n            this.game.ticks(),\n            "built",\n          );\n          this.follow(player, 7);\n          const lead = queuedUpgrades[0]!;\n          this.setDecision(\n            queuedUpgrades.length === 1\n              ? "Upgrade a protected productive factory"\n              : `Queue ${queuedUpgrades.length} productive factory upgrades`,\n            `The queue spends about ${Math.round(upgradeQueue.totalCost).toLocaleString()} gold across ${queuedUpgrades.length} independent factory upgrade${queuedUpgrades.length === 1 ? "" : "s"}. The lead factory serves ${lead.ownCities + lead.ownPorts} owned and ${lead.externalCities + lead.externalPorts} non-embargoed external stops, so surplus capital compounds active rail throughput instead of waiting through ${queuedUpgrades.length} separate decision cycles.`,\n          );\n          return;\n        }\n      }\n"""
          text = text[:start] + upgrade_block + text[end:]

          # Batch new factories while preserving the existing opportunity fallback.
          start = text.index("        const factory = factoryPlans")
          end = text.index("        const bestFactory = factoryPlans.find", start)
          factory_block = """        const factoryBuildOptions = factoryPlans\n          .filter(\n            ({ plan }) =>\n              plan?.canBuild !== false &&\n              plan?.canBuild !== undefined &&\n              ((plan.overlappingRailroads?.length ?? 0) > 0 ||\n                (plan.ghostRailPaths?.length ?? 0) > 0),\n          )\n          .sort((a, b) => b.placement.score - a.placement.score);\n        const maximumFactoryBuilds = Math.min(\n          factoryBuildOptions.length,\n          Math.max(\n            needsShipyardFactory ? Math.min(3, unconnectedShipyards.length) : 0,\n            Math.max(0, desiredFactories - factories.length),\n          ),\n        );\n        const factoryQueueSpendCap = needsGrowthFactory\n          ? Math.min(\n              factorySpendableGold,\n              Math.max(queuedGoldSpendCap, economicCosts.factory),\n            )\n          : Math.min(factorySpendableGold, queuedGoldSpendCap);\n        const factoryQueue = selectPurchaseQueue({\n          spendCap: factoryQueueSpendCap,\n          minimumPurchases: Math.min(\n            queuedPurchaseTarget,\n            maximumFactoryBuilds,\n          ),\n          maximumPurchases: maximumFactoryBuilds,\n          risk: this.economicPlan.risk,\n          capitalPressure: this.economicPlan.capitalDeploymentPressure,\n          candidates: factoryBuildOptions.map((candidate, index) => ({\n            index,\n            cost: Number(candidate.plan!.cost),\n            value: candidate.placement.score,\n            returnRatio: Math.min(\n              1,\n              (candidate.placement.productiveStops / 4) * 0.5 +\n                candidate.placement.railEfficiency * 0.5,\n            ),\n            synergy:\n              (candidate.plan!.overlappingRailroads?.length ?? 0) > 0\n                ? 1\n                : candidate.placement.railEfficiency,\n          })),\n        });\n        const queuedFactories: typeof factoryBuildOptions = [];\n        const queuedFactoryTiles: number[] = [];\n        for (const index of factoryQueue.selectedIndices) {\n          const candidate = factoryBuildOptions[index];\n          if (\n            candidate?.plan?.canBuild === false ||\n            candidate?.plan?.canBuild === undefined\n          )\n            continue;\n          const tile = candidate.plan.canBuild;\n          if (\n            queuedFactoryTiles.some(\n              (other) =>\n                this.game.euclideanDistSquared(tile, other) <\n                structureMinDistance ** 2,\n            )\n          )\n            continue;\n          queuedFactoryTiles.push(tile);\n          queuedFactories.push(candidate);\n        }\n        if (queuedFactories.length > 0) {\n          for (const candidate of queuedFactories) {\n            this.eventBus.emit(\n              new BuildUnitIntentEvent(\n                UnitType.Factory,\n                candidate.plan!.canBuild as number,\n              ),\n            );\n          }\n          this.nextEconomicCostRefreshTick = 0;\n          this.nextFactoryOpportunityTick = factoryOpportunityRetryTick(\n            this.game.ticks(),\n            "built",\n          );\n          this.follow(player, 7);\n          const lead = queuedFactories[0]!;\n          this.setDecision(\n            queuedFactories.length === 1\n              ? needsShipyardFactory\n                ? "Connect the isolated shipyard to a factory"\n                : needsGrowthFactory\n                  ? "Build the first growth factory"\n                  : "Build a factory to activate the rail economy"\n              : `Queue ${queuedFactories.length} rail-growth factories`,\n            `The queue commits about ${Math.round(factoryQueue.totalCost).toLocaleString()} gold to ${queuedFactories.length} non-conflicting factory site${queuedFactories.length === 1 ? "" : "s"}. The lead site links ${lead.ownCities} owned cities, ${lead.ownPorts} owned ports, and ${lead.externalCities + lead.externalPorts} external stops at ${(lead.placement.railEfficiency * 100).toFixed(0)}% route efficiency, converting surplus capital into several active rail investments in one cycle.`,\n          );\n          return;\n        }\n"""
          text = text[:start] + factory_block + text[end:]

          # Batch profitable trade ports and diversify them by representative partner owner.
          start = text.index("        const profitablePort = portPlans.find")
          end = text.index("      const borderingNationContacts = [...enemies.values()]", start)
          port_tail = """        const profitablePorts = portPlans.filter(\n          ({ expectedGold, expectedGoldPerTick, plan, factoryConnected }) =>\n            plan?.canBuild !== false &&\n            plan?.canBuild !== undefined &&\n            (this.moduleSignals.portRequireFactoryConnection === false ||\n              factoryConnected) &&\n            expectedGold / Math.max(1, Number(plan.cost)) >=\n              (this.moduleSignals.portRequiredReturnRatio ?? 0.25) &&\n            Number(plan.cost) / Math.max(0.000_001, expectedGoldPerTick) <=\n              (this.moduleSignals.portMaximumPaybackTicks ?? 3_600),\n        );\n        const remainingTradePorts = Math.max(\n          0,\n          desiredTradePorts - ownedPorts.length,\n        );\n        const ownerGroups = new Map<string, number>();\n        let nextOwnerGroup = 1;\n        const portQueue = selectPurchaseQueue({\n          spendCap: queuedGoldSpendCap,\n          minimumPurchases: Math.min(\n            queuedPurchaseTarget,\n            remainingTradePorts,\n          ),\n          maximumPurchases: Math.min(\n            remainingTradePorts,\n            profitablePorts.length,\n          ),\n          risk: this.economicPlan.risk,\n          capitalPressure: this.economicPlan.capitalDeploymentPressure,\n          candidates: profitablePorts.map((candidate, index) => {\n            const ownerID = candidate.partner.owner().id();\n            let group = ownerGroups.get(ownerID);\n            if (group === undefined) {\n              group = nextOwnerGroup++;\n              ownerGroups.set(ownerID, group);\n            }\n            return {\n              index,\n              group,\n              cost: Number(candidate.plan!.cost),\n              value: candidate.score,\n              returnRatio: candidate.returnRatio,\n              synergy: candidate.factoryConnected ? 1 : 0.25,\n            };\n          }),\n        });\n        const queuedPorts: typeof profitablePorts = [];\n        const queuedPortTiles: number[] = [];\n        for (const index of portQueue.selectedIndices) {\n          const candidate = profitablePorts[index];\n          if (\n            candidate?.plan?.canBuild === false ||\n            candidate?.plan?.canBuild === undefined\n          )\n            continue;\n          const tile = candidate.plan.canBuild;\n          if (\n            queuedPortTiles.some(\n              (other) =>\n                this.game.euclideanDistSquared(tile, other) <\n                structureMinDistance ** 2,\n            )\n          )\n            continue;\n          queuedPortTiles.push(tile);\n          queuedPorts.push(candidate);\n        }\n        if (queuedPorts.length > 0) {\n          for (const candidate of queuedPorts) {\n            this.eventBus.emit(\n              new BuildUnitIntentEvent(\n                UnitType.Port,\n                candidate.plan!.canBuild as number,\n              ),\n            );\n          }\n          this.nextEconomicCostRefreshTick = 0;\n          this.follow(queuedPorts[0]!.partner.owner(), 6);\n          const lead = queuedPorts[0]!;\n          this.setDecision(\n            queuedPorts.length === 1\n              ? "Open a profitable trade port"\n              : `Queue ${queuedPorts.length} diversified trade ports`,\n            `The queue commits about ${Math.round(portQueue.totalCost).toLocaleString()} gold across ${queuedPorts.length} distinct trade relationship${queuedPorts.length === 1 ? "" : "s"}. The lead route scores ${Math.round(lead.score * 100)}% quality, returns ${Math.round(lead.returnRatio * 100)}% of build cost per arrival, and ${lead.factoryConnected ? "joins the rail economy" : "uses an independent coastal route"}.`,\n          );\n          return;\n        }\n        const profitablePort = profitablePorts[0];\n        if (\n          profitablePort?.plan !== undefined &&\n          this.economicPlan.spendableGold < Number(profitablePort.plan.cost) &&\n          (this.moduleSignals.portActionUrgency ?? 0) >=\n            (this.moduleSignals.landExpansionPriority ?? 0)\n        ) {\n          this.setDecision(\n            "Save for a high-return trade port",\n            `The route returns ${Math.round(profitablePort.returnRatio * 100)}% of its ${profitablePort.plan.cost.toLocaleString()} cost per arrival at ${Math.round(profitablePort.score * 100)}% relative site quality. Port urgency now exceeds the land-growth ratio, so the trainer is saving only the remaining cost above its protected reserve.`,\n          );\n          return;\n        }\n      }\n"""
          text = text[:start] + port_tail + text[end:]

          # Batch city capacity/rail builds while rejecting mutually conflicting placements.
          start = text.index("      const city = cityPlans")
          end = text.index("    if (\n      this.choiceAllowed(\"strategic\")", start)
          city_block = """      const cityBuildOptions = cityPlans\n        .sort(\n          (a, b) =>\n            b.defenseScore +\n              b.stackPlacement.score +\n              railCityGrowthScore(\n                b.railConnections,\n                b.plan?.overlappingRailroads.length ?? 0,\n              ) -\n              (a.defenseScore +\n                a.stackPlacement.score +\n                railCityGrowthScore(\n                  a.railConnections,\n                  a.plan?.overlappingRailroads.length ?? 0,\n                )) ||\n            b.depth - a.depth,\n        )\n        .filter(\n          ({ plan, railConnections }) =>\n            plan?.canBuild !== false &&\n            plan?.canBuild !== undefined &&\n            (needsPressureCity ||\n              this.economicPlan.action === "stack-capacity" ||\n              (this.economicPlan.action === "activate-rail" &&\n                railConnections > 0)),\n        );\n      const maximumCityBuilds = Math.min(\n        cityBuildOptions.length,\n        needsPressureCity\n          ? Math.max(1, desiredCityCount - cityCount)\n          : this.moduleSignals.allowProductiveStacking\n            ? Math.min(4, queuedPurchaseTarget)\n            : 1,\n      );\n      const cityQueue = selectPurchaseQueue({\n        spendCap: cityBudget.spendableGold,\n        minimumPurchases: Math.min(queuedPurchaseTarget, maximumCityBuilds),\n        maximumPurchases: maximumCityBuilds,\n        risk: this.economicPlan.risk,\n        capitalPressure: this.economicPlan.capitalDeploymentPressure,\n        candidates: cityBuildOptions.map((candidate, index) => {\n          const overlap = candidate.plan?.overlappingRailroads.length ?? 0;\n          const railGrowth = railCityGrowthScore(\n            candidate.railConnections,\n            overlap,\n          );\n          return {\n            index,\n            cost: Number(candidate.plan!.cost),\n            value:\n              candidate.defenseScore +\n              candidate.stackPlacement.score +\n              railGrowth,\n            returnRatio: Math.min(\n              1,\n              candidate.railConnections / 3 + (overlap > 0 ? 0.35 : 0),\n            ),\n            synergy: candidate.stackPlacement.stacked\n              ? 0.85\n              : candidate.railConnections > 0\n                ? 1\n                : 0.35,\n          };\n        }),\n      });\n      const queuedCities: typeof cityBuildOptions = [];\n      const queuedCityTiles: number[] = [];\n      for (const index of cityQueue.selectedIndices) {\n        const candidate = cityBuildOptions[index];\n        if (\n          candidate?.plan?.canBuild === false ||\n          candidate?.plan?.canBuild === undefined\n        )\n          continue;\n        const tile = candidate.plan.canBuild;\n        if (\n          queuedCityTiles.some(\n            (other) =>\n              this.game.euclideanDistSquared(tile, other) <\n              structureMinDistance ** 2,\n          )\n        )\n          continue;\n        queuedCityTiles.push(tile);\n        queuedCities.push(candidate);\n      }\n      if (queuedCities.length > 0) {\n        for (const candidate of queuedCities) {\n          this.eventBus.emit(\n            new BuildUnitIntentEvent(\n              UnitType.City,\n              candidate.plan!.canBuild as number,\n            ),\n          );\n        }\n        this.nextEconomicCostRefreshTick = 0;\n        this.follow(player, 7);\n        const lead = queuedCities[0]!;\n        this.setDecision(\n          queuedCities.length === 1\n            ? lead.stackPlacement.stacked\n              ? "Stack a defensive city cluster"\n              : needsPressureCity\n                ? "Build capacity before the enemy rush"\n                : lead.railConnections >= 2\n                  ? "Bridge the rail network with a city"\n                  : lead.railConnections === 1\n                    ? "Extend a factory rail line with a city"\n                    : trapped\n                      ? "Build capacity while boxed in"\n                      : "Invest in troop capacity"\n            : `Queue ${queuedCities.length} capacity-growth cities`,\n          `The queue commits about ${Math.round(cityQueue.totalCost).toLocaleString()} gold to ${queuedCities.length} non-conflicting city site${queuedCities.length === 1 ? "" : "s"}. The lead site has ${lead.railConnections} usable rail connection${lead.railConnections === 1 ? "" : "s"} at depth ${lead.depth}; batching converts a deep treasury into troop capacity and rail income without waiting a full planner cycle between each independent placement.`,\n        );\n        return;\n      }\n    }\n\n"""
          text = text[:start] + city_block + text[end:]
          trainer.write_text(text)
          PY
          cargo fmt --all
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/openfront-core/src/lib.rs rust/openfront-wasm/src/lib.rs src/client/rust/OpenFrontWasmTypes.ts src/client/rust/OpenFrontWasmEconomyAi.ts src/client/ai/AiModuleCoordinator.ts src/client/ai/AiModule.ts src/client/ai/VisualAiTrainer.ts rust/openfront-core/src/ai_purchase_queue.rs rust/openfront-wasm/src/ai_purchase_queue.rs src/client/ai/PurchaseQueuePolicy.ts
          git commit -m "Wire Rust multi-purchase construction queue"
          git push origin HEAD:agent/rust-port
