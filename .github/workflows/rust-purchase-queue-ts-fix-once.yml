name: Rust purchase queue TS fix once

on:
  push:
    branches:
      - agent/rust-port
    paths:
      - .github/workflows/rust-purchase-queue-ts-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/rust-port
      - name: Preserve economic plan narrowing
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path("src/client/ai/VisualAiTrainer.ts")
          text = path.read_text()
          old = '''            (needsPressureCity ||\n              this.economicPlan.action === "stack-capacity" ||\n              (this.economicPlan.action === "activate-rail" &&\n                railConnections > 0)),'''
          new = '''            (needsPressureCity ||\n              this.economicPlan!.action === "stack-capacity" ||\n              (this.economicPlan!.action === "activate-rail" &&\n                railConnections > 0)),'''
          assert old in text
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/ai/VisualAiTrainer.ts
          git commit -m "Preserve economic plan narrowing in city queue"
          git push origin HEAD:agent/rust-port
