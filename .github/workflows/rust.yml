name: Rust

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - package.json
      - package-lock.json
      - .cargo/**
      - rust/**
      - src/client/rust/**
      - src/core/game/GameMap.ts
      - tests/rust/**
      - scripts/build-rust-wasm.mjs
      - scripts/smoke-rust-wasm.mjs
      - .github/workflows/rust.yml
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - package.json
      - package-lock.json
      - .cargo/**
      - rust/**
      - src/client/rust/**
      - src/core/game/GameMap.ts
      - tests/rust/**
      - scripts/build-rust-wasm.mjs
      - scripts/smoke-rust-wasm.mjs
      - .github/workflows/rust.yml

permissions:
  contents: read

jobs:
  check:
    name: Format, test, and check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install Node dependencies
        run: npm ci --ignore-scripts
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --target wasm32-unknown-unknown
      - name: Select Rust
        run: rustup default stable
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run tests
        run: cargo test --workspace
      - name: Check workspace
        run: cargo check --workspace
      - name: Check WebAssembly target
        run: cargo check --package openfront-wasm --target wasm32-unknown-unknown
      - name: Build WebAssembly module
        run: node scripts/build-rust-wasm.mjs
      - name: Smoke test WebAssembly ABI
        run: node scripts/smoke-rust-wasm.mjs
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Run TypeScript and Rust parity harness
        run: npx vitest run tests/rust/GameMapParity.test.ts
